name: 🏷️ CD · Release Test

on:
  workflow_dispatch:

permissions: {}

jobs:
  release:
    permissions:
      actions: read
      checks: read
      contents: write
      deployments: write
      packages: write
      pull-requests: write
    uses: ./.github/workflows/release.yml
    with:
      force: true
      github_packages: false
      maven_central: false
    secrets: inherit
