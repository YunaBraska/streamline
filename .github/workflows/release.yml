name: 🏷️ CD · Release

on:
  schedule:
    - cron: '0 7 * * 1'
  workflow_call:
    inputs:
      maven_central:
        required: false
        default: true
        type: boolean
      github_packages:
        required: false
        default: true
        type: boolean
      force:
        required: false
        default: false
        type: boolean
  workflow_dispatch:
    inputs:
      maven_central:
        description: Maven Central.
        required: true
        default: true
        type: boolean
      github_packages:
        description: GitHub Packages.
        required: true
        default: true
        type: boolean
      force:
        description: Force.
        required: true
        default: false
        type: boolean

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  merge:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      checks: read
      contents: write
      pull-requests: write
    outputs:
      enabled: ${{ steps.merge.outputs.enabled }}
    steps:
      - name: "🤖 Merge Green Updates"
        id: merge
        env:
          GH_TOKEN: ${{ secrets.BOT_TOKEN }}
        shell: sh
        run: |
          set -eu
          if [ -z "${GH_TOKEN:-}" ]; then
            printf 'enabled=false\n'
            printf 'enabled=false\n' >> "${GITHUB_OUTPUT}"
            echo "BOT_TOKEN is not configured; weekly release is disabled."
            exit 0
          fi

          printf 'enabled=true\n'
          printf 'enabled=true\n' >> "${GITHUB_OUTPUT}"
          gh pr list --base main --state open --json number,headRefName,isDraft,mergeStateStatus \
            --jq '.[] | select(.isDraft == false) | select(.mergeStateStatus == "CLEAN") | select((.headRefName | startswith("dependabot/")) or (.headRefName | startswith("bot/maintenance-"))) | .number' \
            | while IFS= read -r pr; do
                if ! gh pr checks "${pr}" >/dev/null 2>&1; then
                  echo "PR #${pr} is not green; leaving it open."
                  continue
                fi
                gh pr merge "${pr}" --squash --delete-branch
              done

  plan:
    needs:
      - merge
    if: ${{ always() && (needs.merge.result == 'success' || needs.merge.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      dry_run_central: ${{ steps.plan.outputs.dry_run_central }}
      dry_run_github_packages: ${{ steps.plan.outputs.dry_run_github_packages }}
      ref: ${{ steps.plan.outputs.ref }}
      should_release: ${{ steps.plan.outputs.should_release }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - name: "🧑‍💻 Checkout"
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0

      - name: "🏷️ Plan Date Release"
        id: plan
        env:
          AUTO_RELEASE: ${{ needs.merge.outputs.enabled }}
          EVENT_NAME: ${{ github.event_name }}
          FORCE: ${{ inputs.force || false }}
          GITHUB_PACKAGES: ${{ github.event_name == 'schedule' && true || inputs.github_packages }}
          MAVEN_CENTRAL: ${{ github.event_name == 'schedule' && true || inputs.maven_central }}
        shell: sh
        run: |
          set -eu
          git fetch --tags origin

          if [ "${EVENT_NAME}" = "schedule" ]; then
            git fetch origin main
            git checkout --detach origin/main
          fi

          if [ "${MAVEN_CENTRAL}" = "true" ] && [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "Maven Central publishing must run from main." >&2
            exit 1
          fi

          latest_tag=$(git tag --merged HEAD --sort=-creatordate | sed -n '1p')
          has_material_changes=false
          if [ -z "${latest_tag}" ]; then
            has_material_changes=true
          elif ! git diff --quiet "${latest_tag}"..HEAD -- pom.xml src; then
            has_material_changes=true
          fi

          should_release=false
          if [ "${EVENT_NAME}" = "schedule" ] && [ "${AUTO_RELEASE}" = "true" ] && [ "${has_material_changes}" = "true" ]; then
            should_release=true
          elif [ "${EVENT_NAME}" != "schedule" ] && { [ "${FORCE}" = "true" ] || [ "${has_material_changes}" = "true" ]; }; then
            should_release=true
          fi

          version=$(git log -1 --format=%cs HEAD | tr '-' '.')
          if [ "${should_release}" = "true" ] && git rev-parse -q --verify "refs/tags/${version}" >/dev/null; then
            echo "Release tag already exists: ${version}" >&2
            exit 1
          fi

          if [ "${MAVEN_CENTRAL}" = "true" ]; then
            dry_run_central=false
          else
            dry_run_central=true
          fi
          if [ "${GITHUB_PACKAGES}" = "true" ]; then
            dry_run_github_packages=false
          else
            dry_run_github_packages=true
          fi

          ref=$(git rev-parse HEAD)
          {
            printf 'dry_run_central=%s\n' "${dry_run_central}"
            printf 'dry_run_github_packages=%s\n' "${dry_run_github_packages}"
            printf 'ref=%s\n' "${ref}"
            printf 'should_release=%s\n' "${should_release}"
            printf 'version=%s\n' "${version}"
          } >> "${GITHUB_OUTPUT}"

          printf 'dry_run_central=%s\n' "${dry_run_central}"
          printf 'dry_run_github_packages=%s\n' "${dry_run_github_packages}"
          printf 'ref=%s\n' "${ref}"
          printf 'latest_tag=%s\n' "${latest_tag:-none}"
          printf 'has_material_changes=%s\n' "${has_material_changes}"
          printf 'maven_central=%s\n' "${MAVEN_CENTRAL}"
          printf 'github_packages=%s\n' "${GITHUB_PACKAGES}"
          printf 'should_release=%s\n' "${should_release}"
          printf 'version=%s\n' "${version}"

  build:
    needs:
      - plan
    if: ${{ always() && needs.plan.outputs.should_release == 'true' }}
    permissions:
      contents: read
    uses: ./.github/workflows/build-common.yml
    with:
      ref: ${{ needs.plan.outputs.ref }}
      release: true

  publish-central:
    needs:
      - plan
      - build
    if: ${{ always() && !cancelled() && needs.build.result == 'success' }}
    permissions:
      actions: read
      contents: read
      deployments: write
    uses: ./.github/workflows/publish-central.yml
    with:
      dry_run: ${{ needs.plan.outputs.dry_run_central == 'true' }}
    secrets: inherit

  publish-github-packages:
    needs:
      - plan
      - build
    if: ${{ always() && !cancelled() && needs.build.result == 'success' }}
    permissions:
      actions: read
      contents: read
      deployments: write
      packages: write
    uses: ./.github/workflows/publish-github-packages.yml
    with:
      dry_run: ${{ needs.plan.outputs.dry_run_github_packages == 'true' }}

  create-release:
    needs:
      - plan
      - build
      - publish-central
      - publish-github-packages
    if: ${{ always() && !cancelled() && needs.build.result == 'success' && needs.publish-central.result == 'success' && needs.publish-github-packages.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
    steps:
      - name: "🧑‍💻 Checkout [${{ needs.build.outputs.commit_sha }}]"
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
          ref: ${{ needs.build.outputs.commit_sha }}

      - name: "📥 Download Build Artifact"
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: build-workspace
          path: ${{ github.workspace }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: "🔍 Read Java Info"
        id: java_info
        uses: YunaBraska/java-info-action@11a434ffbf6bb3357363d1933be71a4076a90a6b # v3

      - name: "☕ Setup Java [${{ steps.java_info.outputs.java_version }}]"
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: ${{ steps.java_info.outputs.java_version }}
          cache: maven

      - name: "📦 Prepare Release Assets"
        env:
          MAVEN_CMD: ${{ steps.java_info.outputs.cmd }}
          RELEASE_VERSION: ${{ needs.plan.outputs.version }}
        shell: sh
        run: |
          set -eu
          artifact_id=$(${MAVEN_CMD} -q -DforceStdout help:evaluate -Dexpression=project.artifactId)
          assets_dir="${RUNNER_TEMP}/release-assets"
          rm -rf "${assets_dir}"
          mkdir -p "${assets_dir}"
          cp pom.xml "${assets_dir}/${artifact_id}-${RELEASE_VERSION}.pom"
          cp "target/${artifact_id}-${RELEASE_VERSION}.jar" "${assets_dir}/"
          cp "target/${artifact_id}-${RELEASE_VERSION}-sources.jar" "${assets_dir}/"
          cp "target/${artifact_id}-${RELEASE_VERSION}-javadoc.jar" "${assets_dir}/"

      - name: "🏷️ Create GitHub Release [${{ needs.plan.outputs.version }}]"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ needs.plan.outputs.version }}
          TARGET_SHA: ${{ needs.build.outputs.commit_sha }}
        shell: sh
        run: |
          set -eu
          if gh release view "${RELEASE_VERSION}" >/dev/null 2>&1; then
            echo "GitHub release already exists for ${RELEASE_VERSION}"
          else
            gh release create "${RELEASE_VERSION}" --target "${TARGET_SHA}" --generate-notes
          fi
          gh release upload "${RELEASE_VERSION}" "${RUNNER_TEMP}/release-assets"/* --clobber
