name: 🏷️ CD · Release

on:
  schedule:
    - cron: '0 7 * * 1'
  workflow_call:
    inputs:
      maven_central:
        required: false
        default: true
        type: boolean
      github_packages:
        required: false
        default: true
        type: boolean
      force:
        required: false
        default: false
        type: boolean
  workflow_dispatch:
    inputs:
      maven_central:
        description: Maven Central.
        required: true
        default: true
        type: boolean
      github_packages:
        description: GitHub Packages.
        required: true
        default: true
        type: boolean
      force:
        description: Force.
        required: true
        default: false
        type: boolean

permissions: {}

jobs:
  release:
    permissions:
      actions: read
      checks: read
      contents: write
      deployments: write
      packages: write
      pull-requests: write
    uses: YunaBraska/YunaBraska/.github/workflows/wc_java_release.yml@feature/java-release-cicd-spike
    with:
      auto_merge: true
      force: ${{ inputs.force }}
      github_packages: ${{ github.event_name == 'schedule' && true || inputs.github_packages }}
      maven_central: ${{ github.event_name == 'schedule' && true || inputs.maven_central }}
      version_source: date
    secrets:
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      CENTRAL_PASS: ${{ secrets.CENTRAL_PASS }}
      CENTRAL_USER: ${{ secrets.CENTRAL_USER }}
      GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
      GPG_SIGNING_KEY: ${{ secrets.GPG_SIGNING_KEY }}
