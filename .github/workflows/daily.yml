name: Temporary Release Rehearsal

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Rehearse all reversible stages while withholding only Maven Central upload.
        required: true
        default: true
        type: boolean
      force:
        description: Release even when no source or Maven metadata changed since the latest tag.
        required: true
        default: true
        type: boolean

permissions: {}

jobs:
  release:
    permissions:
      actions: read
      contents: write
      deployments: write
      packages: write
    uses: ./.github/workflows/release.yml
    with:
      dry_run: ${{ inputs.dry_run }}
      force: ${{ inputs.force }}
    secrets: inherit
