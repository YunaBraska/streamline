name: 📦 CD · Publish GitHub Packages

on:
  workflow_call:
    inputs:
      build_output_timestamp:
        description: UTC timestamp resolved by the release build.
        required: true
        type: string

permissions: {}

jobs:
  publish:
    permissions:
      actions: read
      contents: read
      deployments: write
      packages: write
    uses: YunaBraska/YunaBraska/.github/workflows/wc_java_publish_github_packages.yml@feature/java-release-cicd-spike
    with:
      build_output_timestamp: ${{ inputs.build_output_timestamp }}
