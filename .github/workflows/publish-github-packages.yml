name: 📦 CD · Publish GitHub Packages

on:
  workflow_call:
    inputs:
      run_id:
        required: false
        default: ''
        type: string
      dry_run:
        required: false
        default: false
        type: boolean
  workflow_dispatch:
    inputs:
      run_id:
        description: Build run.
        required: true
        type: string
      dry_run:
        description: Dry run.
        required: true
        default: false
        type: boolean

permissions: {}

jobs:
  publish:
    permissions:
      actions: read
      contents: read
      deployments: write
      packages: write
    uses: YunaBraska/YunaBraska/.github/workflows/wc_java_publish_github_packages.yml@df93fbaf3b2026272d2eff4a1794ec175f99d466
    with:
      run_id: ${{ inputs.run_id }}
      dry_run: ${{ inputs.dry_run }}
