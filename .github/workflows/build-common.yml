name: Build Streamline

on:
  workflow_call:
    inputs:
      ref:
        description: Commit, branch, or tag to build.
        required: false
        default: ''
        type: string
      release:
        description: Build a versioned release workspace for publication.
        required: false
        default: false
        type: boolean
      version:
        description: Version to apply to the release workspace.
        required: false
        default: ''
        type: string
    outputs:
      commit_sha:
        description: Immutable source revision that produced the build output.
        value: ${{ jobs.build.outputs.commit_sha }}
      build_output_timestamp:
        description: UTC commit timestamp used for reproducible build output.
        value: ${{ jobs.build.outputs.build_output_timestamp }}
  workflow_dispatch:
    inputs:
      ref:
        description: Commit, branch, or tag to build.
        required: false
        default: ''
        type: string
      release:
        description: Build a versioned release workspace.
        required: true
        default: false
        type: boolean
      version:
        description: Version to apply when release is enabled.
        required: false
        default: ''
        type: string

permissions: {}

jobs:
  build:
    name: Build Streamline
    permissions:
      contents: read
    uses: YunaBraska/YunaBraska/.github/workflows/wc_java_release_build.yml@feature/java-release-cicd-spike
    with:
      ref: ${{ inputs.ref || github.sha }}
      release: ${{ inputs.release }}
      version: ${{ inputs.version }}
