name: 🧩 CI · Common Build

on:
  workflow_call:
    inputs:
      ref:
        description: Checkout ref.
        required: false
        default: ''
        type: string
      upload_artifact:
        description: Upload build workspace.
        required: false
        default: false
        type: boolean
    outputs:
      commit_sha:
        description: Commit SHA.
        value: ${{ jobs.build.outputs.commit_sha }}
      version:
        description: Version.
        value: ${{ jobs.build.outputs.version }}
  workflow_dispatch:
    inputs:
      ref:
        description: Ref.
        required: false
        default: ''
        type: string
      upload_artifact:
        description: Upload artifact.
        required: true
        default: false
        type: boolean

permissions: {}

jobs:
  build:
    permissions:
      contents: read
    uses: YunaBraska/YunaBraska/.github/workflows/wc_java_build_common.yml@3823e7c3068ee244b07370bef2a2c19942c9bc18
    with:
      ref: ${{ inputs.ref || github.sha }}
      upload_artifact: ${{ inputs.upload_artifact }}
