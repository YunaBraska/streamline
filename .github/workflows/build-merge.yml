name: 🔄 CD · Snapshot

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      maven_central:
        description: Maven Central.
        required: true
        default: true
        type: boolean
      github_packages:
        description: GitHub Packages.
        required: true
        default: true
        type: boolean

permissions: {}

concurrency:
  group: build-main-${{ github.ref || github.run_id }}
  cancel-in-progress: false

jobs:
  snapshot:
    permissions:
      actions: read
      contents: write
      deployments: write
      packages: write
    uses: YunaBraska/YunaBraska/.github/workflows/wc_java_release.yml@34fa113361f06c1af745e67991b336e857f623c8
    with:
      github_packages: ${{ github.event_name == 'push' && true || inputs.github_packages }}
      maven_central: ${{ github.event_name == 'push' && true || inputs.maven_central }}
      release_strategy: snapshot
      version_source: date
    secrets:
      CENTRAL_PASS: ${{ secrets.CENTRAL_PASS }}
      CENTRAL_USER: ${{ secrets.CENTRAL_USER }}
      GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
      GPG_SIGNING_KEY: ${{ secrets.GPG_SIGNING_KEY }}
